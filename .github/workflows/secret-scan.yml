name: Secret scanning

# Scans every push and pull request for committed credentials using Gitleaks.
#
# The ruleset is the upstream default, extended by the repository-local .gitleaks.toml.
# That file does not weaken any provider rule; it only teaches the scanner that a
# Stellar account ID (G...) is a *public* address rather than a credential, which the
# generic high-entropy heuristic would otherwise report for every SEP-1 fixture. See
# the comments in .gitleaks.toml for why that allowlist matches on the value's shape
# instead of on a path.
#
# No `paths:` filter here, unlike registry-validate.yml: a secret can be committed in
# any file, so narrowing the trigger would be the one place a leak could slip through.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# The scan reads the repository and reports through the job's own status. It never
# writes a comment, a label, or a commit, so no write scope is needed.
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        # Gitleaks scans the commit range, not just the working tree, so a secret that
        # was added and then removed in a later commit of the same branch is still
        # caught. That needs full history.
        fetch-depth: 0

    - name: Scan for committed secrets
      # v3 is a runtime-only migration (node20 -> node24); the GITLEAKS_* inputs below
      # are unchanged from v2. Pinned off v2 because GitHub removes Node 20 from hosted
      # runners on 2026-09-16, after which a node20 action fails to start outright.
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
        # Commenting on a pull request would require `pull-requests: write`. The job's
        # pass/fail status is the signal instead, which keeps this workflow read-only.
        GITLEAKS_ENABLE_COMMENTS: false
        # A summary on the run itself is where a developer looks after a red check.
        GITLEAKS_ENABLE_SUMMARY: true
        # Never keep results.sarif as an artifact: it pinpoints the file, line, and commit
        # of every hit, and the summary enabled above already reports that to whoever needs
        # it. Re-enabling this would hand anyone with read access a map to the secret.
        GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
