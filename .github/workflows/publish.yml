name: Publish to npm

on:
  # Never on a tag push: a tag carries the pusher's own credentials, not GITHUB_TOKEN, so it would fire this workflow regardless of intent.
  workflow_dispatch:

# Publishing authenticates to npm with NODE_AUTH_TOKEN; it needs nothing from the
# GitHub token beyond reading the ref it was dispatched against.
#
# id-token: write is the exception, and it is not a write to the repository: it lets the
# runner mint the short-lived OIDC token npm exchanges for a provenance attestation, so
# consumers can verify the tarball was built here by this workflow.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Tags are what the version guard below checks against, and a shallow clone
          # fetches none of them.
          fetch-depth: 0

      # This workflow is dispatched manually, so nothing about the ref says which version
      # is being released -- GITHUB_REF_NAME is a branch here, not a tag. What must hold
      # is that the commit being published is one semantic-release actually released, and
      # since the release never writes the version back to protected main (issue #172) the
      # tag on this commit is the only record of that -- package.json on main is stale by
      # design. So the release tag is both the gate and the source of the version.
      #
      # Without this, dispatching against any commit publishes a version number that
      # corresponds to no release, and npm versions are immutable -- there is no undoing
      # it, only deprecating it.
      - name: Resolve the version from the release tag on this commit
        id: release
        run: node scripts/release-version.mjs

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The tag is the released version; package.json on main never learns about it. Write
      # it in here so the tarball, its provenance attestation, and `--version` all report
      # the version being published. --no-git-tag-version because nothing is committed:
      # this is a workspace edit for the publish only, discarded with the runner.
      - name: Set the package version to the released version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      # CI already gates these on the way to main, but a dispatch can target any commit,
      # and the release path is the last place a regression should slip through. Seconds
      # of runtime against an immutable publish.
      - name: Lint
        run: npm run lint

      - name: Type-check tests
        run: npm run typecheck

      # --provenance signs the tarball with the OIDC token from id-token: write above,
      # so npm records which repository, workflow, and commit built it. Consumers running
      # this inside their own CI can then verify the package came from here rather than
      # taking the registry's word for it.
      - name: Publish package
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
