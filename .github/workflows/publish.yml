name: Publish to npm

on:
  # Never on a tag push: a tag carries the pusher's own credentials, not GITHUB_TOKEN, so it would fire this workflow regardless of intent.
  workflow_dispatch:

# Publishing authenticates to npm with NODE_AUTH_TOKEN; it needs nothing from the
# GitHub token beyond reading the ref it was dispatched against.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
