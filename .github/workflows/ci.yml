name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x, 23.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type-check and build
      run: npm run build
      
    - name: Run tests
      if: matrix.node-version != '22.x'
      run: npm test

    - name: Run tests with coverage gate
      if: matrix.node-version == '22.x'
      run: npm run test:coverage

    - name: Smoke test composite GitHub Action
      if: matrix.node-version == '22.x'
      id: test-action
      uses: ./
      continue-on-error: true
      with:
        domain: testanchor.stellar.org
        network: testnet

    - name: Verify Action execution and outputs
      if: matrix.node-version == '22.x'
      run: |
        echo "Outputs - Total: ${{ steps.test-action.outputs.total }}, Pass: ${{ steps.test-action.outputs.pass }}, Fail: ${{ steps.test-action.outputs.fail }}, Warn: ${{ steps.test-action.outputs.warn }}"
        echo "Report Path: ${{ steps.test-action.outputs.report-path }}"
        test -n "${{ steps.test-action.outputs.total }}"
        test -n "${{ steps.test-action.outputs.pass }}"
        test -f "${{ steps.test-action.outputs.report-path }}"
