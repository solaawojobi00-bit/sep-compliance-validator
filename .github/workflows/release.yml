name: Release

# Gated on CI rather than on `push` directly: a release must never be cut from a
# commit the test matrix has not already gone green on. `needs:` cannot reach across
# workflow files, so `workflow_run` is the only mechanism that expresses this.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# semantic-release pushes the release tag and cuts the GitHub release (contents), and
# comments on the issues and PRs contained in a release (issues, pull-requests).
permissions:
  contents: write
  issues: write
  pull-requests: write

# Two releases running at once would race on the same tag and on main's history.
# Never cancel one in flight: a half-run release leaves a tag with no GitHub release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    # ci.yml also runs on pull_request, whose workflow_run carries the PR's head branch;
    # the `branches` filter above catches all but a fork branch literally named "main".
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # semantic-release derives the last release from tags and the changelog from
          # every commit since it; a shallow clone silently produces wrong release notes.
          fetch-depth: 0
          # Deliberately unlike every other workflow here, which sets this to false:
          # semantic-release pushes the release tag (`git push --tags`) over this remote.
          # Only the tag — nothing is written back to main, which branch protection would
          # reject anyway (GH006), so no plugin here commits to the branch.
          persist-credentials: true

      # workflow_run checks out main as it is *now*, which is not necessarily the commit
      # CI just passed. If main has moved on, that newer commit is running its own CI and
      # will trigger its own release — so skipping here loses nothing.
      # Deferring is a normal outcome, not a failure, so this records a flag rather than
      # exiting non-zero — a red X here would be indistinguishable from a broken release.
      - name: Confirm main still points at the commit CI validated
        id: guard
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [ "$CURRENT_SHA" = "$VALIDATED_SHA" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "main is at $CURRENT_SHA but CI validated $VALIDATED_SHA; deferring to that commit's own run."
          fi

      - name: Use Node.js 22.x
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          # Unlike action.yml, which pins package-manager-cache: false, an explicit cache
          # takes setup-node's first branch and never reaches packageManager auto-detection.
          # The cache also earns its keep here: `npm ci` below runs against this workspace.
          cache: "npm"

      - name: Install dependencies
        if: steps.guard.outputs.proceed == 'true'
        run: npm ci

      # No NPM_TOKEN and no npm publish here: .releaserc.json sets npmPublish to false,
      # so this analyses the commits, tags the release, and cuts a GitHub release carrying
      # the notes. Publishing to npm stays a deliberate, manual act via publish.yml, which
      # derives the version to publish from the tag this step pushes.
      #
      # Nothing is committed back to main: main requires pull requests and status checks,
      # and GITHUB_TOKEN cannot bypass either, so a write-back plugin fails every run
      # (GH006) after the notes have already been computed. See issue #172.
      - name: Release
        if: steps.guard.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
