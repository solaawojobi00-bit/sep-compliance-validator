name: Feature request
description: Suggest a new capability or an improvement to an existing one.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Proposing support for a SEP the validator does not cover yet? Use the
        **New SEP checker** template instead — it carries the implementation checklist.

  - type: input
    id: area
    attributes:
      label: Which SEP or area
      description: >-
        The SEP or part of the project this affects — e.g. `sep10`, the registry, the
        HTML report, the GitHub Action, the CLI.
      placeholder: "sep24 / HTML report"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What you would like the validator to do.
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Why it's useful
      description: >-
        The problem this solves. What can't you do today, and who benefits — anchor
        operators, wallet developers, contributors?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, or workarounds you are using now.
    validations:
      required: false
