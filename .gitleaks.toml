# Gitleaks configuration for sep-compliance-validator.
#
# The upstream default ruleset is the baseline and is never weakened — every provider
# rule (AWS, npm, GitHub, Slack, private-key blocks, ...) stays exactly as shipped.
# The allowlists below exist for one reason: this repository is a Stellar tool, so its
# fixtures are full of Stellar account IDs, and those are *public* keys.
#
# A Stellar Ed25519 public key is base32, starts with "G", and is safe to publish — it
# is an account's address, the equivalent of an IBAN. The corresponding credential is a
# *seed*, which starts with "S". Because the fixtures assign those addresses to fields
# named SIGNING_KEY / validKey, the default `generic-api-key` heuristic sees
# "key = <56 high-entropy chars>" and reports them; all 15 such findings in this tree
# are that same false positive.
#
# These allowlists match on the *secret's shape*, not on a path. That is deliberate and
# is the narrower of the two options: a global `paths` allowlist makes gitleaks skip the
# whole file before any rule is evaluated, which would blanket-silence a genuine
# credential that landed in test/. Matching the value instead means only this one public
# key format is ever ignored. An AWS key, an npm or Slack token, a PEM block, or a
# Stellar *secret seed* (S...) does not match these regexes and still fails the scan,
# wherever in the repository it appears.

title = "sep-compliance-validator secret scanning"

[extend]
useDefault = true

# One singular `[allowlist]` table rather than several `[[allowlists]]` entries, because
# the plural top-level array is only honoured by newer gitleaks than CI runs.
# gitleaks-action@v3 pins gitleaks 8.24.3, which parses `[[allowlists]]` at the top level
# without applying it — so every allowlist below was silently inert on the scanner that
# actually gates the repository. It was not noticed because the workflow scans the pushed
# commit *range*, not the tree: the fixture keys already on main are never re-scanned, so
# the failure only surfaces on a commit that adds a new line containing one.
#
# Verified against both 8.24.3 (CI) and 8.30.1 (current release): fixture keys clean, and
# a Stellar secret seed still reported. If the pinned scanner is ever raised past 8.25,
# `[[allowlists]]` becomes available and these can be split back into described entries.
#
# The two regexes are:
#   1. Stellar Ed25519 *public* account IDs used as fixture data (G + 55 base32 chars).
#      These are addresses, not credentials; secret seeds start with S and are
#      deliberately not allowlisted.
#   2. Deliberately malformed placeholder keys asserting the SEP-1/SEP-10 rejection paths.
[allowlist]
description = "Stellar public account IDs and malformed placeholder keys used as fixture data. Addresses, not credentials: secret seeds (S...) are deliberately not allowlisted."
regexTarget = "secret"
regexes = [
  '''^G[A-Z2-7]{55}$''',
  '''^GNOTVALID[A-Z0-9]*$''',
]
